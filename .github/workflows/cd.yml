name: CD - Build, Push to ECR & Deploy to EC2 (m7i-flex.large)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: "ap-southeast-2"
  ECR_BACKEND_REPO: "datapilot-backend"
  ECR_FRONTEND_REPO: "datapilot-frontend"

jobs:
  # ============================================================================
  # Stage 1: Build Docker Images on GitHub (16GB RAM) & Push to Amazon ECR
  # ============================================================================
  build-and-push-ecr:
    name: Build Images & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      backend_image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
      frontend_image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # Build & Push Backend Docker Image
      # ------------------------------------------------------------------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Build & Push Frontend Docker Image
      # ------------------------------------------------------------------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:8000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2: Deploy to AWS EC2 (m7i-flex.large) by Pulling Pre-built Images
  # ============================================================================
  deploy-to-ec2:
    name: Pull & Run on EC2 (m7i-flex.large)
    needs: build-and-push-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Login Password
        id: ecr-auth
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$ECR_PASSWORD"
          echo "password=$ECR_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Execute Fast Remote Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/5] Navigating to project directory..."
            cd /home/${{ secrets.EC2_USERNAME || 'ubuntu' }}/datapilot || exit 1

            echo "🔑 [2/5] Authenticating Docker with Amazon ECR..."
            echo "${{ steps.ecr-auth.outputs.password }}" | docker login --username AWS --password-stdin ${{ needs.build-and-push-ecr.outputs.registry }}

            echo "📥 [3/5] Pulling pre-built images from Amazon ECR..."
            export BACKEND_IMAGE="${{ needs.build-and-push-ecr.outputs.backend_image }}"
            export FRONTEND_IMAGE="${{ needs.build-and-push-ecr.outputs.frontend_image }}"
            docker compose pull

            echo "🐳 [4/5] Starting containers with updated images..."
            docker compose up -d --remove-orphans

            echo "🧹 [5/5] Cleaning up old images and checking health..."
            docker image prune -f
            sleep 10
            curl -f http://localhost:8000/health || (echo "Healthcheck failed!" && exit 1)

            echo "✅ DataPilot successfully updated on EC2 (m7i-flex.large)!"
