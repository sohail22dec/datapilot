services:
  # ----------------------------------------------------------------------------
  # DataPilot FastAPI Backend Service (Python 3.12 + LangGraph + uv)
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-datapilot-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datapilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - datapilot-net

  # ----------------------------------------------------------------------------
  # DataPilot Next.js 16 Frontend Service (Standalone + React 19 + Tailwind v4)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-datapilot-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    container_name: datapilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datapilot-net

networks:
  datapilot-net:
    driver: bridge
